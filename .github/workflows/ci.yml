name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke (${{ matrix.os }} / Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '18'
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '22'
          - os: macos-latest
            node: '20'
          - os: windows-latest
            node: '20'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check (all .mjs)
        shell: bash
        run: |
          set -e
          count=0
          for f in $(git ls-files '*.mjs'); do node --check "$f"; count=$((count+1)); done
          echo "checked $count files"

      - name: Shell script syntax
        if: runner.os != 'Windows'
        shell: bash
        run: for f in install.sh uninstall.sh package.sh; do bash -n "$f"; done

      - name: install.ps1 must keep its UTF-8 BOM
        shell: bash
        run: |
          node -e "const b=require('fs').readFileSync('install.ps1'); if(!(b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF)){console.error('install.ps1 丢失了 UTF-8 BOM：PowerShell 5.1 会把中文读成乱码');process.exit(1)} console.log('install.ps1 BOM OK')"

      - name: PDF extraction self-test (no Spotlight required)
        shell: bash
        run: node scripts/selftest-pdf.mjs

      - name: End-to-end smoke (demo data, report, dashboard)
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/courses"
          export FILES_DIR="$RUNNER_TEMP/courses"
          export CANVAS_URL="https://canvas.example.edu"
          export CANVAS_TOKEN="dummy-token"
          export WEB_LANG=zh
          node scripts/gen-config.mjs
          node cli.mjs demo
          node cli.mjs status
          node cli.mjs dashboard
          test -f out/dashboard/index.html
          node cli.mjs demo --off
          echo "smoke test passed"

      - name: Web server smoke without CANVAS_HUB_PORT
        shell: bash
        run: |
          set -e
          unset CANVAS_HUB_PORT
          mkdir -p "$RUNNER_TEMP/courses"
          export FILES_DIR="$RUNNER_TEMP/courses"
          export CANVAS_URL="https://canvas.example.edu"
          export CANVAS_TOKEN="dummy-token"
          node scripts/gen-config.mjs
          node cli.mjs demo
          node server.mjs > web-smoke.log 2>&1 &
          WEB_PID=$!
          started=0
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf "http://127.0.0.1:8788/api/state" > /dev/null; then started=1; break; fi
          done
          if [ "$started" != "1" ]; then
            echo "server did not start; log follows"
            cat web-smoke.log
            kill $WEB_PID 2>/dev/null || true
            exit 1
          fi
          curl -sf "http://127.0.0.1:8788/api/state" | head -c 120
          echo ""
          kill $WEB_PID 2>/dev/null || true
          echo "web server smoke passed (config-driven port)"

      - name: PWA / LAN self-test (manifest, service worker, token auth, certs)
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/courses"
          export FILES_DIR="$RUNNER_TEMP/courses"
          export CANVAS_URL="https://canvas.example.edu"
          export CANVAS_TOKEN="dummy-token"
          node scripts/gen-config.mjs
          node cli.mjs demo
          node scripts/selftest-pwa.mjs
          node cli.mjs demo --off

  powershell:
    name: Windows scripts (PowerShell + Task Scheduler)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in @('install.ps1', 'uninstall.ps1')) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              Write-Host "FAIL: $f -> $($errors[0].Message)"
              $failed = $true
            } else {
              Write-Host "OK: $f"
            }
          }
          if ($failed) { exit 1 }

      - name: Task Scheduler abstraction (create, status, remove)
        shell: pwsh
        run: |
          $env:NODE_BIN = (Get-Command node).Source
          $env:ENABLE_MORNING = '1'
          $env:ENABLE_EVENING = '1'
          $env:ENABLE_WEB = '1'
          $env:MORNING = '08:00'
          $env:EVENING = '20:00'
          $env:PORT = '8788'
          node scripts/schedule.mjs install
          node scripts/schedule.mjs status
          node scripts/schedule.mjs remove

      - name: End-to-end smoke on Windows
        shell: pwsh
        run: |
          $env:FILES_DIR = "$env:RUNNER_TEMP\courses"
          $env:CANVAS_URL = 'https://canvas.example.edu'
          $env:CANVAS_TOKEN = 'dummy-token'
          node scripts/gen-config.mjs
          node cli.mjs demo
          node cli.mjs status
          node cli.mjs dashboard
          if (-not (Test-Path 'out/dashboard/index.html')) { throw 'dashboard not generated' }
          node cli.mjs demo --off
          Write-Host 'windows smoke test passed'
